name: Kicad - production files generator

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - '**.kicad_pcb'
      - '**.kicad_sch'
      - '**.kicad_pro'
      - '**.yml'
      - '**.yaml'
      - 'doc/assets'
  workflow_dispatch:

env:
  branch: ${{ github.head_ref || github.ref_name }}
  dir: "hw/out"
  kibot: "doc/assets/kibot"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      names: ${{ steps.set-matrix.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - id: set-matrix
        run: |
          if [ -f hw/sch_pcb/PCB_matrix.yaml ]; then
            MATRIX=$(python3 -c "
          import yaml, json
          with open('hw/sch_pcb/PCB_matrix.yaml') as f:
              projects = yaml.safe_load(f)
          matrix = {'include': [
              {'name': p['name'], 'dir': p['dir'],
               'schema': p['dir'] + '/' + p['name'] + '.kicad_sch',
               'board':  p['dir'] + '/' + p['name'] + '.kicad_pcb',
               'extra_layers': p.get('extra_layers', [])}
              for p in projects
          ]}
          print(json.dumps(matrix))
          ")
            NAMES=$(python3 -c "
          import yaml
          with open('hw/sch_pcb/PCB_matrix.yaml') as f:
              projects = yaml.safe_load(f)
          print(' '.join(p['name'] for p in projects))
          ")
          else
            PCB=$(find hw/sch_pcb -maxdepth 1 -name "*.kicad_pcb" | head -1)
            NAME=$(basename "$PCB" .kicad_pcb)
            MATRIX="{\"include\":[{\"name\":\"$NAME\",\"dir\":\"hw/sch_pcb\",\"schema\":\"hw/sch_pcb/$NAME.kicad_sch\",\"board\":\"hw/sch_pcb/$NAME.kicad_pcb\",\"extra_layers\":[]}]}"
            NAMES="$NAME"
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "names=$NAMES" >> $GITHUB_OUTPUT


  ERC:
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/erc.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}/${{ matrix.name }}


  DRC:
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/drc.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}/${{ matrix.name }}


  schematics:
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/schematics.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_docs/${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_sch_${{ matrix.name }}
          path: ${{ env.dir }}_docs/${{ matrix.name }}/**


  placement:
    name: "Placement and XML"
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/placement.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_docs/${{ matrix.name }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/xml.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_docs/${{ matrix.name }}

      - name: "Collect files"
        run: |
          tree
          mkdir doc_xml_${{ matrix.name }} || true
          mv ${{ matrix.dir }}/*.xml doc_xml_${{ matrix.name }}/ || true
          mv ${{ env.dir }}_docs/${{ matrix.name }}/*.csv doc_xml_${{ matrix.name }}/ || true

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_xml_${{ matrix.name }}
          path: doc_xml_${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_placement_${{ matrix.name }}
          path: |
            ${{ env.dir }}_docs/${{ matrix.name }}/**/*.pdf
            ${{ env.dir }}_docs/${{ matrix.name }}/**/*.svg
            ${{ env.dir }}_docs/${{ matrix.name }}/**/*.csv


  report:
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/report.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_report/${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_report_${{ matrix.name }}
          path: ${{ env.dir }}_report/${{ matrix.name }}/


  ibom:
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ env.kibot }}/ibom.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_ibom/${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_ibom_${{ matrix.name }}
          path: ${{ env.dir }}_ibom/${{ matrix.name }}/


  gerbers:
    name: "Fabrication: Gerbers, Drill and PnP"
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - name: "Prepare gerbers config"
        id: gerber_config
        env:
          EXTRA_LAYERS: ${{ toJson(matrix.extra_layers) }}
        run: |
          python3 <<'PYEOF'
          import json, os, yaml

          extra_layers = json.loads(os.environ["EXTRA_LAYERS"])
          src = "${{ env.kibot }}/gerbers.kibot.yaml"
          config = src

          if extra_layers:
              with open(src) as f:
                  cfg = yaml.safe_load(f)
              for out in cfg["outputs"]:
                  if out.get("type") == "gerber":
                      out["layers"] += [l for l in extra_layers if l not in out["layers"]]
              config = "${{ env.kibot }}/gerbers.gen.${{ matrix.name }}.kibot.yaml"
              with open(config, "w") as f:
                  yaml.safe_dump(cfg, f, sort_keys=False)

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"config={config}\n")
          PYEOF

      - uses: INTI-CMNB/KiBot@v2_dk10
        with:
          config: ${{ steps.gerber_config.outputs.config }}
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_gerbers/${{ matrix.name }}
          verbose: 3

      - name: "Rename output"
        run: for file in $(find ${{ env.dir }}_gerbers/${{ matrix.name }} -type f); do sudo mv "${file}" "${file//${{ matrix.name }}/${{ env.branch }}}" || true ; done

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: hw_cam_profi_${{ matrix.name }}
          path: ${{ env.dir }}_gerbers/${{ matrix.name }}/gerbers/**


  graphics:
    name: "CAD and render"
    needs: [discover]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.pat }}
          ref: ${{ github.head_ref }}

      - name: "Get MLAB 3D models library"
        run: git clone --depth 1 https://github.com/MLAB-project/kicad-mlab.git mlab_lib

      - uses: INTI-CMNB/KiBot@v2_dk10
        env:
          KISYS3DMOD_MLAB: /github/workspace/mlab_lib/3Dmodels
          MLAB_3DMODELS: /github/workspace/mlab_lib/3Dmodels
          KISYS3MOD_MLAB: /github/workspace/mlab_lib/3Dmodels
          KICAD_MLAB: /github/workspace/mlab_lib
        with:
          config: ${{ env.kibot }}/cad.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_cad/${{ matrix.name }}

      - uses: INTI-CMNB/KiBot@v2_dk10
        env:
          KISYS3DMOD_MLAB: /github/workspace/mlab_lib/3Dmodels
          MLAB_3DMODELS: /github/workspace/mlab_lib/3Dmodels
          KISYS3MOD_MLAB: /github/workspace/mlab_lib/3Dmodels
          KICAD_MLAB: /github/workspace/mlab_lib
        with:
          config: ${{ env.kibot }}/render.kibot.yaml
          schema: ${{ matrix.schema }}
          board: ${{ matrix.board }}
          dir: ${{ env.dir }}_img/${{ matrix.name }}
          verbose: 3

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_cad_${{ matrix.name }}
          path: ${{ env.dir }}_cad/${{ matrix.name }}/**

      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: doc_img_${{ matrix.name }}
          path: ${{ env.dir }}_img/${{ matrix.name }}/img/**


  cad_postprocess:
    name: "CAD postprocess"
    needs: [discover, graphics]
    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doc_cad_${{ matrix.name }}
          path: doc_cad

      - name: Install CAD postprocess tools
        run: |
          sudo apt-get update
          sudo apt-get install -y admesh

      - name: Convert STL to binary STL and compress large STEP
        run: |
          threshold=$((50 * 1024 * 1024))

          find doc_cad -type f -name '*.stl' | while read -r f; do
            tmp="${f}.tmp"
            admesh --write-binary-stl="$tmp" "$f"
            mv "$tmp" "$f"
          done

          find doc_cad -type f -name '*.step' | while read -r f; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$threshold" ]; then
              gzip -9 "$f"
            fi
          done

      - name: Diagnostic output sizes
        run: |
          echo "STL files:"
          find doc_cad -type f -name '*.stl' -exec stat -c '%n %s bytes' {} \;
          echo "STEP/STEP.GZ files:"
          find doc_cad -type f \( -name '*.step' -o -name '*.step.gz' \) -exec stat -c '%n %s bytes' {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: doc_cad_processed_${{ matrix.name }}
          path: doc_cad/**


  UPDATE_REPO:
    runs-on: ubuntu-latest
    name: Update repository
    # nad tagem neni kam commitovat, vysledky zustanou jen jako artefakty behu
    if: ${{ github.ref_type == 'branch' }}
    needs: [discover, cad_postprocess, gerbers, schematics, placement, report, ibom]
    steps:
      - uses: actions/checkout@v4
        with:
          # bez tohoto skonci checkout na odpojenem HEAD a commit nema kam jit
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.pat }}

      - run: |
          git pull --force --rebase || true
          git submodule update --remote || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Remove old manufacturing data
        run: |
          rm -rf hw/cam_profi || true
          rm -rf doc/gen || true

      - name: Extract to right position
        env:
          NAMES: ${{ needs.discover.outputs.names }}
        run: |
          # zkopiruje obsah zdrojove slozky do cile, cilovou slozku vytvori predem
          copy_into() {
            src="$1"
            dst="$2"
            mkdir -p "$dst"
            if [ -d "$src" ] && [ -n "$(ls -A "$src")" ]; then
              cp -r "$src"/. "$dst"/
            else
              echo "::warning::Artefakt '$src' chybi nebo je prazdny, preskakuji"
            fi
          }

          for name in $NAMES; do
            if [ -f hw/sch_pcb/PCB_matrix.yaml ]; then
              gen="doc/gen/$name"
              cam="hw/cam_profi/$name"
            else
              gen="doc/gen"
              cam="hw/cam_profi"
            fi

            mkdir -p "$gen/img" "$gen/mesh" "$cam/gbr" "$cam/assembly" "$cam/ibom"

            copy_into "doc_img_$name"               "$gen/img"
            copy_into "doc_cad_processed_$name/cad" "$gen"
            copy_into "hw_cam_profi_$name"          "$cam/gbr"
            copy_into "doc_sch_$name/docs"          "$gen"
            copy_into "doc_xml_$name"               "$cam"
            copy_into "doc_placement_$name"         "$cam/assembly"
            copy_into "doc_report_$name"            "$gen"
            copy_into "doc_ibom_$name/docs"         "$cam/ibom"

            # PnP z gerberu patri k osazovacim podkladum, ne mezi gerbery
            if [ -d "$cam/gbr/PnP" ]; then
              copy_into "$cam/gbr/PnP" "$cam/assembly/PnP"
              rm -rf "$cam/gbr/PnP"
            fi
          done

          rm -rf doc_img_* doc_cad_* doc_cad_processed_* hw_cam_profi_* doc_sch_* \
                 doc_placement_* doc_xml_* doc_report_* doc_ibom_* || true

          git add . -f

      - uses: stefanzweifel/git-auto-commit-action@v4.16.0
        with:
          commit_message: Update actions products
          add_options: '-A -f'
